<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Quản lý đơn hàng và tồn kho Sương Mai.">
  <title>Quản trị đơn hàng — Sương Mai</title>
  <link rel="stylesheet" href="admin.css">
  <script src="../cart/cart-api.js" defer></script>
  <script src="../account/account-api.js" defer></script>
  <script src="admin.js" defer></script>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../shared/site-theme.css">
</head>
<body>
  <a class="skip-link" href="#main">Bỏ qua điều hướng</a>
  <header><a href="/">Sương Mai <span>QUẢN TRỊ</span></a><nav><a href="/catalog/">Cửa hàng</a><a href="/account/">Tài khoản</a></nav></header>
  <main id="main" class="page">
    <p class="eyebrow">KHU VỰC QUẢN TRỊ</p><h1>Đơn hàng &amp; tồn kho</h1>
    <section id="login-panel" class="panel"><h2>Đăng nhập quản trị</h2><p>Chỉ tài khoản admin được phép truy cập. Quyền luôn được kiểm tra lại ở máy chủ.</p><form id="login-form"><label>Email<input name="email" type="email" autocomplete="username" required></label><label>Mật khẩu<input name="password" type="password" autocomplete="current-password" required></label><button type="submit">Đăng nhập</button></form></section>
    <p id="status" role="status" aria-live="polite"></p>
    <section id="dashboard" hidden>
      <div class="toolbar"><label for="status-filter">Lọc trạng thái</label><select id="status-filter"><option value="">Tất cả</option><option value="pending">Chờ xác nhận</option><option value="confirmed">Đã xác nhận</option><option value="processing">Đang xử lý</option><option value="shipped">Đã gửi</option><option value="completed">Hoàn tất</option><option value="cancelled">Đã hủy</option></select><button id="logout" class="secondary" type="button">Đăng xuất</button></div>
      <div class="admin-grid"><section><h2>Đơn hàng</h2><div id="orders"></div></section><section><h2>Chi tiết đơn</h2><div id="order-detail"><p>Chọn một đơn hàng.</p></div></section></div>
      <section class="inventory-panel"><h2>Tồn kho</h2><div id="inventory"></div></section>
    </section>
  </main>
  <footer>Rang tại Đà Lạt · giao hàng tận nơi</footer>
</body>
</html>
