services:
  - type: web
    name: suongmai-coffee-web
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/v1/health
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_URL
        sync: false
      - key: AUTH_RATE_LIMIT_KEY
        generateValue: true
      - key: SESSION_COOKIE_SECURE
        value: "1"
      - key: DB_CONNECT_TIMEOUT
        value: "5"
      - key: DATABASE_URL
        fromDatabase:
          name: suongmai-coffee-db
          property: connectionString

databases:
  - name: suongmai-coffee-db
    plan: free
